name: graduabjj
description: "BJJEasy - Sistema Whitelabel para Academias de Jiu-Jitsu"
publish_to: 'none'

version: 2.1.0+84

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.1
  cloud_functions: ^5.2.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # UI Components
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.1.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.0
  crop_your_image: ^1.1.0
  file_picker: ^8.0.0
  csv: ^6.0.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  collection: ^1.19.0
  http: ^1.2.0
  qr_flutter: ^4.1.0
  # mobile_scanner 7.x bumps the underlying GoogleMLKit pods to a version
  # whose GTMSessionFetcher constraint aligns with Firebase 11.x. Older 5.x
  # pulled in GTMSessionFetcher < 4.0 which conflicts with our Firebase set.
  mobile_scanner: ^7.2.0
  in_app_update: ^4.2.3
  package_info_plus: ^8.0.0

  # Animations
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # Deep links (Mercado Pago OAuth return)
  app_links: ^7.0.0

dependency_overrides:
  objective_c: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/bjjeasy_logo.png"
  adaptive_icon_background: "#F8F8F8"
  adaptive_icon_foreground: "assets/images/bjjeasy_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Note: Font files need to be added to assets/fonts/
  # Download Inter font from https://fonts.google.com/specimen/Inter
  # and place Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf
  # in the assets/fonts/ folder, then uncomment the fonts section below.
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
