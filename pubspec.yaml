name: graduabjj
description: "MyDojo - Sistema Whitelabel para Academias de Jiu-Jitsu"
publish_to: 'none'

version: 3.4.1+114

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.1
  cloud_functions: ^5.2.0
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.3.3
  share_plus: ^10.1.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI Components
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  table_calendar: ^3.1.2

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.1.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.0
  crop_your_image: ^1.1.0
  file_picker: ^11.0.0
  csv: ^6.0.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  collection: ^1.19.0
  http: ^1.2.2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  mobile_scanner: ^7.4.0
  in_app_update: ^4.2.3
  package_info_plus: ^8.0.0
  in_app_purchase: ^3.2.0

  # Payments
  flutter_stripe: ^11.4.0

  # Charts (evolução física)
  fl_chart: ^0.69.2

  # PDF export (avaliação física)
  pdf: ^3.11.1
  printing: ^5.13.4

  # Animations
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # Deep links (Mercado Pago OAuth return)
  app_links: ^7.0.0

dependency_overrides:
  objective_c: ^9.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/images/mydojo_app_icon.png"
    icon_size: 256
  image_path: "assets/images/mydojo_app_icon.png"
  adaptive_icon_background: "#F4F3EF"
  adaptive_icon_foreground: "assets/images/mydojo_mark_foreground.png"
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Note: Font files need to be added to assets/fonts/
  # Download Inter font from https://fonts.google.com/specimen/Inter
  # and place Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf
  # in the assets/fonts/ folder, then uncomment the fonts section below.
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
